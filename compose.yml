name: go-elasticsearch-poc

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.5
    container_name: go-elasticsearch-poc-es
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      # Local POC only. Never use these settings in staging or production.
      - xpack.security.enabled=false
      - xpack.security.autoconfiguration.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      # Fails if ES is unreachable or the cluster does not reach at least yellow within 5s.
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' > /dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 60s

volumes:
  elasticsearch_data:
